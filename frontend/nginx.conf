# Keep cache headers at server level so locations inherit security headers.
map $uri $net2map_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    /index.html "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:;" always;
    add_header Cache-Control $net2map_cache_control always;

    # Proxy /api/* to the FastAPI backend
    location /api/ {
        client_max_body_size 25m;
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Public edge: discard client-supplied forwarding chains.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # WebSocket proxy for real-time scan progress
    location /ws/ {
        proxy_pass         http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 86400s;
    }

    # OpenAPI UI and schema: /docs (Swagger UI), /redoc, /openapi.json. The
    # backend answers 404 when OPENAPI_ENABLED=false. Declaring add_header here
    # replaces the server-level set, so the SPA CSP is not added and the
    # backend's docs-specific CSP (CDN assets + inline-script hash) is the only
    # policy; the remaining security headers are repeated. API calls made from
    # the docs page go through /api/ and still require a bearer token.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA fallback – serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
