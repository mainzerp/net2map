name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install security tools separately from application dependencies
        run: |
          python -m venv "$RUNNER_TEMP/security-venv"
          "$RUNNER_TEMP/security-venv/bin/python" -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit all resolved Python dependencies
        run: >-
          "$RUNNER_TEMP/security-venv/bin/pip-audit"
          --requirement backend/requirements.txt --strict --progress-spinner off
      - name: Scan Python source for security issues
        run: |
          # --output keeps the JSON report clean: bandit prints its progress bar to stdout.
          "$RUNNER_TEMP/security-venv/bin/bandit" --recursive backend --exclude backend/tests --severity-level medium --confidence-level all --format json --output "$RUNNER_TEMP/bandit.json" || { cat "$RUNNER_TEMP/bandit.json"; exit 1; }
          cat "$RUNNER_TEMP/bandit.json"
          python -c 'import json, os, sys; report = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "bandit.json"))); errors = report.get("errors", []); print(json.dumps(errors)); sys.exit(bool(errors))'
      - name: Install all locked frontend dependencies without lifecycle scripts
        working-directory: frontend
        run: npm ci --include=dev --ignore-scripts
      - name: Audit frontend dependencies at every severity including development tools
        working-directory: frontend
        run: npm audit --include=dev --audit-level=info

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests/ -v
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_TOKEN: "test-token"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: [security-scan, test-backend, test-frontend]
    if: success() && needs.security-scan.result == 'success' && github.event_name == 'push'
    env:
      POSTGRES_PASSWORD: ci-dummy
      SECRET_TOKEN: ci-dummy
      DEFAULT_ADMIN_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - run: docker compose -f docker-compose.yml -f docker-compose.local.yml build

  docker-push:
    runs-on: ubuntu-latest
    needs: [security-scan, docker-build]
    if: success() && needs.security-scan.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_PASSWORD: ci-dummy
      SECRET_TOKEN: ci-dummy
      DEFAULT_ADMIN_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          TAG=${GITHUB_REF#refs/tags/}
          # docker-compose.local.yml builds the local images net2map-backend / net2map-frontend
          docker compose -f docker-compose.yml -f docker-compose.local.yml build
          for img in backend frontend; do
            docker tag net2map-$img ghcr.io/${{ github.repository }}/$img:$TAG
            docker tag net2map-$img ghcr.io/${{ github.repository }}/$img:latest
            docker push ghcr.io/${{ github.repository }}/$img:$TAG
            docker push ghcr.io/${{ github.repository }}/$img:latest
          done
