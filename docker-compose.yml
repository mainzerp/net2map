x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: netmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netmap
      POSTGRES_USER: netmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - netmap-pgdata:/var/lib/postgresql/data
    networks:
      - netmap
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netmap"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: netmap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - netmap-redisdata:/data
    networks:
      - netmap
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: netmap-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://netmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/netmap"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      # Trusted proxies for X-Forwarded-For (rate limiting sees real client IPs).
      # Defaults to "*" (any upstream) -- set to your reverse-proxy CIDR,
      # e.g. UVICORN_FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
    volumes:
      - netmap-data:/data          # persistent storage for map background images etc.
    networks:
      - netmap
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    build: ./backend
    container_name: netmap-celery
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: "postgresql://netmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/netmap"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      RUN_MIGRATIONS: "false"
    volumes:
      - netmap-data:/data
    networks:
      - netmap
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --timeout 5 | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Celery Beat Scheduler ───────────────────────────────────────────────────
  celery-beat:
    build: ./backend
    container_name: netmap-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --schedule /data/celerybeat-schedule
    environment:
      DATABASE_URL: "postgresql://netmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/netmap"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      RUN_MIGRATIONS: "false"
    networks:
      - netmap
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── React/Nginx Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # Inside Docker the nginx proxy rewrites /api → backend:8000
        # so we leave VITE_API_URL empty (relative path)
        VITE_API_URL: ""
    container_name: netmap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netmap

volumes:
  netmap-data:
  netmap-pgdata:
  netmap-redisdata:

networks:
  netmap:
    driver: bridge
