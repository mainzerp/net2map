# Fixed project name: container, volume and network names do not depend on the
# checkout folder (volumes net2map_*).
#
# Images: by default the prebuilt GHCR images are pulled (public, no login):
#   docker compose up -d
# NET2MAP_VERSION (in .env) pins a release tag, e.g. v3.2.1; default "latest".
# To run the local checkout instead, build it (tags the same image names locally):
#   docker compose up --build -d
name: net2map

x-backend-image: &backend-image ghcr.io/mainzerp/net2map/backend:${NET2MAP_VERSION:-latest}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: net2map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: net2map
      POSTGRES_USER: net2map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U net2map"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: net2map-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    image: *backend-image
    build: ./backend
    container_name: net2map-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://net2map:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/net2map"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      # Trusted proxies for X-Forwarded-For (rate limiting sees real client IPs).
      # Defaults to "*" (any upstream) -- set to your reverse-proxy CIDR,
      # e.g. UVICORN_FORWARDED_ALLOW_IPS: "172.16.0.0/12"
      UVICORN_FORWARDED_ALLOW_IPS: "${UVICORN_FORWARDED_ALLOW_IPS:-*}"
      # uvicorn worker processes; >1 is safe because REDIS_URL is set.
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      REQUEST_LOG_ENABLED: "${REQUEST_LOG_ENABLED:-false}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-90}"
      OPENAPI_ENABLED: "${OPENAPI_ENABLED:-true}"
    volumes:
      - data:/data          # persistent storage for map background images etc.
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      # Liveness: database + Redis only; Celery worker status is /health?deep=1.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery-worker:
    image: *backend-image
    build: ./backend
    container_name: net2map-celery
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: "postgresql://net2map:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/net2map"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      # Fallback retention for the audit purge task (DB setting wins when set).
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-90}"
      RUN_MIGRATIONS: "false"
    volumes:
      - data:/data
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping --timeout 5 | grep -q 'pong' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Celery Beat Scheduler ───────────────────────────────────────────────────
  celery-beat:
    image: *backend-image
    build: ./backend
    container_name: net2map-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --schedule /data/celerybeat-schedule
    environment:
      DATABASE_URL: "postgresql://net2map:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/net2map"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      RUN_MIGRATIONS: "false"
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── Latency Monitor ─────────────────────────────────────────────────────────
  # Long-running ICMP probe loop (python -m latency.monitor). Uses the backend
  # image; runs as appuser like the Celery worker (iputils-ping). Migrations are
  # skipped here and the service waits for a healthy backend, which has applied
  # them, so it never races alembic or starts against an old schema.
  latency-monitor:
    image: *backend-image
    build: ./backend
    container_name: net2map-latency-monitor
    restart: unless-stopped
    command: python -m latency.monitor
    environment:
      DATABASE_URL: "postgresql://net2map:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/net2map"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_TOKEN: "${SECRET_TOKEN:?Set SECRET_TOKEN in .env}"
      JWT_SECRET: "${JWT_SECRET:-}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RUN_MIGRATIONS: "false"
    networks:
      - net2map
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── React/Nginx Frontend ─────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/mainzerp/net2map/frontend:${NET2MAP_VERSION:-latest}
    build:
      context: ./frontend
      args:
        # Inside Docker the nginx proxy rewrites /api → backend:8000
        # so we leave VITE_API_URL empty (relative path)
        VITE_API_URL: ""
    container_name: net2map-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - net2map

volumes:
  data:
  pgdata:
  redisdata:

networks:
  net2map:
    driver: bridge
