# Demo instance override: runs a second, isolated Net2Map stack alongside the
# main instance. Separate containers, volumes and network via the compose
# project name; seeded with dummy data from backend/seed_db.py.
#
# Usage:
#   docker compose -p net2map-demo -f docker-compose.yml -f docker-compose.demo.yml up -d
#   docker compose -p net2map-demo -f docker-compose.yml -f docker-compose.demo.yml exec backend python seed_db.py
#   docker compose -p net2map-demo -f docker-compose.yml -f docker-compose.demo.yml down -v   # tear down incl. data
#
# Frontend: http://localhost:3200  (main instance stays on :3000)
services:
  postgres:
    container_name: net2map-demo-postgres

  redis:
    container_name: net2map-demo-redis

  backend:
    image: net2map-backend   # reuse already-built image, no rebuild
    container_name: net2map-demo-backend
    volumes:
      # seed_db.py is excluded from the image (backend/.dockerignore) so it can
      # never run in production; the demo mounts it read-only for manual seeding.
      - ./backend/seed_db.py:/app/seed_db.py:ro

  celery-worker:
    image: net2map-backend
    container_name: net2map-demo-celery

  celery-beat:
    image: net2map-backend
    container_name: net2map-demo-celery-beat

  frontend:
    image: net2map-frontend
    container_name: net2map-demo-frontend
    ports: !override ["3200:80"]
